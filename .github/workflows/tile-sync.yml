# Daily Tile location sync: where each demo device's Tile tracker last was,
# written to the demo tracker's database (tileLocations): the old Realtime Database
# until the tracker's cutover, the hub's Firestore after it (it follows
# settings/equipmentCutover; see backend/tile-sync/tile_sync.py and
# STEP-5-PLAN.md). Moved here from the chs-equipment repo (INTEGRATION-PLAN.md step 1).
#
# The daily run only happens once the repository variable TILE_SYNC_HERE is
# 'true', so it can't run here and in chs-equipment on the same morning. A
# manual run (Actions -> Tile location sync -> Run workflow) always works, which
# is how to test it before switching the timer on.
#
# NB: this repo is public, so run logs are too. tile_sync.py only ever prints
# tile counts, never names or addresses.
name: Tile location sync

on:
  schedule:
    - cron: '0 18 * * *' # 18:00 UTC = 07:00 NZST (06:00 during daylight saving)
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to write: auto follows the tracker (old database before the cutover, Firestore after); both fills Firestore ahead of the cutover'
        type: choice
        options: [auto, both, rtdb, firestore]
        default: auto

permissions:
  contents: read
  actions: write

jobs:
  tile-sync:
    if: github.event_name == 'workflow_dispatch' || vars.TILE_SYNC_HERE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/tile-sync/requirements.txt
      - run: python -m unittest test_hub_firestore
        working-directory: backend/tile-sync
      - run: python backend/tile-sync/tile_sync.py
        env:
          TILE_EMAIL:    ${{ secrets.TILE_EMAIL }}
          TILE_PASSWORD: ${{ secrets.TILE_PASSWORD }}
          # The chs-equipment project's service account (the demo tracker's
          # old Realtime Database).
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.CHS_EQUIPMENT_SERVICE_ACCOUNT }}
          # The staff schedule's (hub's) service account, for Firestore: the
          # same three secrets the Thursday reminder uses. Read for the cutover
          # switch; written once the tracker is on Firestore.
          FIREBASE_PROJECT_ID:   ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY:  ${{ secrets.FIREBASE_PRIVATE_KEY }}
          TILE_SYNC_TARGET:      ${{ inputs.target || 'auto' }}
      # Tells Settings → Background jobs how this run went (shared/jobs.js).
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: always()
      - run: node scripts/report-job.mjs tile-sync ${{ job.status }}
        if: always()
        env:
          FIREBASE_PROJECT_ID:   ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY:  ${{ secrets.FIREBASE_PRIVATE_KEY }}
      # GitHub pauses timed workflows after 60 days without repo activity -
      # re-enabling this one on every run keeps it alive.
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/tile-sync.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
