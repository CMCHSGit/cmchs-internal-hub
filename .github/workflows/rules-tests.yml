# Runs the Firestore security-rules tests (rules/tests) on the Firebase emulator
# whenever the rules, the tests, the tracker's data layer or this file change, and
# on request. A failing run means a rule no longer does what its test says. It does
# not publish anything and does not hold up the site deploy; the result shows on
# the commit. How to run the same thing locally: rules/README.md, "Testing".
name: Rules tests

on:
  push:
    branches: [main]
    paths:
      - 'rules/**'
      - 'apps/equipment/src/**'
      - '.github/workflows/rules-tests.yml'
  pull_request:
    paths:
      - 'rules/**'
      - 'apps/equipment/src/**'
      - '.github/workflows/rules-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rules-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            rules/package-lock.json
      # The emulator needs Java.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      # The hub's own install: the tracker data-layer test bundles its code with esbuild.
      - run: npm ci
      - run: npm ci
        working-directory: rules
      - run: npm test
        working-directory: rules
