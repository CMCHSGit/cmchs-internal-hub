<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · CMCHS Internal Hub</title>
  <link rel="icon" type="image/png" href="/brand/logo-mark.png">
  <!-- Deep links into a single-page app. GitHub Pages has no rewrite rules: any
       path with no file behind it lands here, including real routes like
       /schedule/my. For those, hand the request to that app's index.html with
       the original path in ?redirect=, which the app puts back before it mounts.
       Everything else falls through to the genuine not-found page below.

       This runs before any of the markup renders, so a real route never flashes
       "Page not found" on the way through. Once the service worker is installed
       it answers these navigations itself and this is never reached — it covers
       the first visit, a hard reload after an update, and browsers with no SW. -->
  <script>
    (function () {
      // Apps that route client-side. A path under one of these is its business.
      var APPS = ['/schedule/']
      var path = location.pathname
      // Tools that moved: old address prefix -> new one, so bookmarks keep working.
      var MOVED = { '/service/order-parser/': '/order-parser/' }
      for (var from in MOVED) {
        if (path === from.slice(0, -1) || path.indexOf(from) === 0) {
          location.replace(MOVED[from] + path.slice(from.length) + location.search + location.hash)
          return
        }
      }
      // A missing file is a missing file — only paths that look like routes get
      // handed to an app, so a stale asset URL still reports as not found
      // instead of quietly returning a page of HTML.
      if (/\.[a-z0-9]+$/i.test(path)) return
      for (var i = 0; i < APPS.length; i++) {
        if (path.indexOf(APPS[i]) !== 0) continue
        location.replace(APPS[i] + '?redirect=' + encodeURIComponent(path + location.search + location.hash))
        return
      }
    })()
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@600&family=Source+Sans+3:wght@300;600&display=swap">
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#fff;color:#575756;font:300 16px/1.55 "Source Sans 3",system-ui,sans-serif}
    main{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
    .stripes{display:flex;gap:4px}.stripes span{width:30px;height:5px}
    h2{margin:0;font:600 26px/1.2 "Titillium Web",system-ui,sans-serif;letter-spacing:-.01em;color:#1d1d1d}
    p{margin:0}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:6px;background:#554596;color:#fff;font-weight:600;text-decoration:none;align-self:flex-start}
    a:hover{background:#3f3374}
  </style>
</head>
<body>
  <main>
    <div class="stripes" aria-hidden="true"><span style="background:#554596"></span><span style="background:#80bd01"></span><span style="background:#ef7d00"></span></div>
    <h2>Page not found</h2>
    <p>That page isn’t on the Internal Hub. It may have moved.</p>
    <a href="/">Go to the hub</a>
  </main>
</body>
</html>
