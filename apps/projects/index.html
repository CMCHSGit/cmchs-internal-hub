<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project tracker</title>
<!-- The hub's root manifest, so adding this to a home screen produces the one
     Internal Hub app rather than a second one. Icon paths go through Vite's
     base to /projects/icons/ — the copy in public/. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Internal Hub">
<!-- Set the theme before anything renders, or the page flashes the wrong
     colours. A module runs too late for this, so it is inline. The key is
     shared with the staff schedule: one choice for the whole site. -->
<script>(function(){try{var t=localStorage.getItem('css_theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}})()</script>
</head>
<body>
<header>
  <a class="hub-back" href="/" aria-label="Back to the Internal Hub"><svg class="hub-back-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><img src="/brand/logo-mark.png" alt=""><span class="hub-back-long">Internal Hub</span><span class="hub-back-short">Hub</span></a>
  <h1>Project tracker</h1>
  <span class="sub">Installs, trials, demos and conferences: the job register and weekly timeline in one</span>
  <span class="who" id="who"></span>
</header>
<div id="root"></div>
<script type="module" src="./src/main.jsx"></script>
</body>
</html>
